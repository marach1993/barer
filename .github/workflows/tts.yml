name: TTS
on:
  push:
    paths: ['tts/list.txt', 'tts/gen.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tts/gen.py
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - run: |
          git config user.name "tts-bot"
          git config user.email "tts-bot@users.noreply.github.com"
          git add audio
          if ! git diff --cached --quiet; then
            git commit -m "Generate audio" && git pull --rebase && git push
            # коммит от бота не запускает публикацию сам — просим GitHub Pages пересобрать сайт
            gh api -X POST repos/${{ github.repository }}/pages/builds || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
